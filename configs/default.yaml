# Default configuration for webcam_tracker (Stage 1).
#
# This file holds every non-secret tunable the spec requires to be
# configurable. Nothing machine-specific (like an absolute file path only
# valid on one developer's laptop) belongs here — use paths relative to the
# project root, or override via environment variables / a local .env file
# (see .env.example) for anything machine-specific or secret.
#
# Any value here can be overridden without editing this file by setting an
# environment variable named WEBCAM_TRACKER_<SECTION>__<FIELD> (double
# underscore between section and field), e.g. WEBCAM_TRACKER_VIDEO__SOURCE=1
# to select webcam index 1 instead of 0.

video:
  # "auto" probes for the first working webcam and uses it -- this is what
  # makes the same config work unmodified on a desktop with a USB webcam and
  # a laptop with a built-in webcam, since it doesn't assume a fixed device
  # index (that assignment is OS/driver-dependent and differs per machine).
  #
  # If a machine has more than one camera and auto-detection picks the wrong
  # one, run `.venv\Scripts\python.exe scripts\list_cameras.py` to see every
  # working index, then pin one explicitly here or via
  # WEBCAM_TRACKER_VIDEO__SOURCE in a local .env (gitignored, so each
  # machine can override independently without touching this shared file):
  #   source: "0"                              # explicit webcam index
  #   source: "data/test_videos/sample1.mp4"   # a single video file
  #   source: "data/test_videos"               # every video file in a folder, back to back
  source: "auto"
  # Keep capture/display bandwidth modest for low-power onboard computers.
  # Detection and face recognition use their own input sizes below.
  requested_width: 640
  requested_height: 480
  requested_fps: 30
  # When true, preview scripts also write their annotated output to
  # data/recordings/<script>_<timestamp>.avi -- useful for verifying a trial
  # run afterward on hardware with no attached display (e.g. a Pi in the
  # field). Off by default: it's an extra file write on every frame, only
  # worth the cost when you're actually reviewing a run.
  record: false

streaming:
  # Live MJPEG video + SSE hazard events over plain HTTP -- the headless
  # alternative to cv2.imshow for hardware with no attached display (e.g. a
  # drone). Off by default: when enabled, preview scripts skip the local
  # window entirely and can only be stopped with Ctrl+C, so it's opt-in
  # rather than a silent behavior change.
  enabled: false
  # 0.0.0.0 = every interface, so a phone/laptop on the same network can
  # open http://<device-ip>:<port>/. Use 127.0.0.1 to restrict access to the
  # device itself, e.g. behind a Tailscale/SSH tunnel.
  host: "0.0.0.0"
  port: 8080
  # cv2.IMWRITE_JPEG_QUALITY. Measured ~2ms/frame on the Pi regardless of
  # quality in this range -- this trades bandwidth, not CPU.
  jpeg_quality: 75

logging:
  level: "INFO"   # DEBUG | INFO | WARNING | ERROR
  log_dir: "logs"
  json_format: true

paths:
  models_dir: "models"
  data_dir: "data"

detection:
  # Resolved against paths.models_dir if relative. Auto-downloaded by
  # Ultralytics on first use if the file doesn't exist yet -- see
  # docs/model_licenses.md for exactly which weights this is and their license.
  model_path: "yolo11n.pt"
  # Minimum confidence to keep a detection. Lower = more detections (more
  # false positives); higher = fewer detections (more missed people).
  confidence_threshold: 0.5
  # YOLO resizes the frame to image_size x image_size before inference.
  # 320 keeps the nano model real-time on CPU-class onboard hardware. Raise to
  # 640 only when small/distant-person accuracy matters more than frame rate.
  image_size: 320
  # "auto" uses the GPU if available (verified: RTX 3060 on the primary dev
  # machine), otherwise falls back to CPU. Override to "cpu" to force
  # CPU-only for comparison/testing.
  device: "auto"

tracking:
  # How many frames a track survives with no matching detection before it's
  # dropped (not reported at all, rather than reported with a stale box).
  # 30 frames ~= 1 second at 30fps. Short gaps (a person briefly turning,
  # a missed detection) recover with the SAME track id; longer gaps don't --
  # that's a job for the recovery module (Stage 1.8), not the tracker itself.
  lost_track_buffer: 30
  # Minimum detection confidence to START a brand-new track. Existing tracks
  # can still match to lower-confidence detections (see high_conf_det_threshold)
  # -- this only gates *new* tracks, to avoid spurious one-off detections
  # spawning noise tracks.
  track_activation_threshold: 0.7
  # A new track must match for this many consecutive frames before it's
  # assigned a real ID -- until then it's reported internally as id -1 and
  # PersonTracker filters it out of what it returns. This is what prevents a
  # single flickering false-positive detection from becoming a "tracked person".
  # Note: a track is NEVER confirmed on the very frame it first appears, even
  # with this set to 1 -- confirmation needs at least one more matching frame
  # after that, so 1 and 2 behave identically here; this only starts making a
  # difference at 3+.
  minimum_consecutive_frames: 2
  # Minimum box overlap (IoU, 0-1) required to match a detection to an
  # existing track. Lower = more forgiving of fast motion/low frame rate,
  # but risks matching the wrong nearby person.
  minimum_iou_threshold: 0.1
  # ByteTrack's core idea ("BYTE"): detections above this confidence are
  # matched first/preferentially; detections below it (but still above
  # detection.confidence_threshold) are used as weaker, second-pass evidence
  # -- this is what helps keep a track alive through partial occlusion
  # instead of only trusting high-confidence boxes.
  high_conf_det_threshold: 0.6

perf_monitor:
  # How often (seconds) the rolling FPS figure is recomputed. Shorter =
  # more responsive to sudden slowdowns, but noisier frame-to-frame.
  fps_window_seconds: 0.5
  # Minimum time (seconds) between structured perf-snapshot log lines --
  # keeps continuous per-frame monitoring from spamming the log file.
  log_interval_seconds: 5.0

gimbal:
  # PID gains below are UNTUNED PLACEHOLDERS -- there's no physical gimbal
  # yet to tune against (see docs/01_risks_and_assumptions.md). Error input
  # is normalized frame error (-1..1, from target_selection), not degrees --
  # we don't have a calibrated camera field-of-view yet, so gains are tuned
  # to produce plausible-looking simulated deg/s output directly from that
  # normalized error, not a physically-derived angle.
  pan:
    kp: 80.0
    ki: 5.0
    kd: 8.0
    # Typical pan gimbals rotate roughly this far either side of center.
    angle_limit_deg: 170.0
  tilt:
    kp: 80.0
    ki: 5.0
    kd: 8.0
    # Tilt range is usually much smaller than pan (can't point straight
    # backward/through the mount).
    angle_limit_deg: 60.0
  # Normalized error below this is treated as zero -- avoids jittery
  # micro-corrections from detection/tracking noise when already centered.
  deadband: 0.02
  # Simulated hardware limits, shared by both axes for now.
  max_velocity_deg_s: 120.0
  max_acceleration_deg_s2: 300.0
  # Anti-windup: caps the accumulated integral term so a long period with
  # the target out of reach doesn't cause a big overshoot once it's found.
  integral_limit: 20.0

motion_prediction:
  # Per-track constant-velocity Kalman filter, in PIXEL coordinates. These are
  # starting points that look reasonable on real webcam tracks, not values
  # derived from a measured noise model -- tune by watching the predicted
  # marker in scripts\preview_recovery.py.
  #
  # process_noise vs. measurement_noise is the classic Kalman trade-off:
  # raise process_noise (or lower measurement_noise) to make the filter follow
  # each new detection more closely (responsive but jittery); do the opposite
  # to make it smoother but laggier. Their RATIO is what matters most.
  process_noise: 50.0
  measurement_noise: 5.0
  # Keep a track's filter alive this long after its last detection so recovery
  # can still read the just-lost target's last-known velocity. 1.0s outlives
  # the tracker's own 30-frame (~1s) lost_track_buffer by a hair on purpose.
  max_coast_seconds: 1.5

recovery:
  # Stage 1 reacquisition is IDENTITY-FREE: on loss we search toward where the
  # target was heading and re-lock onto the nearest NEW track that appears
  # near the predicted spot -- whoever it is. This is a labeled placeholder
  # for Stage 2's real face/re-id-gated reacquisition; do not mistake it for
  # actually recognizing the person. These knobs tune the mechanics only.
  give_up_seconds: 5.0
  # Cap on extrapolating the last-known velocity forward. Past this, we stop
  # moving the predicted position (a stale velocity held too long flies away).
  prediction_horizon_seconds: 1.0
  # A new track re-locks only if within this fraction of the frame diagonal
  # from the predicted position. Larger = grabs people farther from the
  # prediction (more eager, more likely wrong -- no identity check yet).
  reacquire_radius_fraction: 0.35
  # Simulated search sweep fed to the gimbal while searching: a normalized
  # (-1..1) error that oscillates around the predicted direction so the
  # (simulated) camera scans for the target instead of freezing.
  search_amplitude: 0.6
  search_period_seconds: 2.0

hazard:
  # Looming-based hazard detection: how soon is a tracked person going to
  # collide with the camera, judged purely from how fast their box grows.
  # No depth sensor and no calibration needed, which is why this runs on the
  # Pi's CPU detector -- the Watchdog wearable ran the identical math behind
  # a Hailo NPU, and the drone build has no Hailo hat.
  #
  # EVERY NUMBER BELOW IS INHERITED, NOT DERIVED. They were tuned on 176 real
  # fired alerts from chest-height footage of someone WALKING. static_bottom_y
  # encodes that camera height and pitch; ttc_alert encodes walking closure
  # rates. Neither is right for a camera on a drone. Re-measure from drone
  # footage before trusting an alert -- treat these as a starting point that
  # is known to be wrong, not a default that happens to be untested.

  # Frames of box history before any TTC is attempted. This is the alert
  # latency floor: ~0.54s at the Pi's measured 9 FPS, vs ~0.21s at the 24 FPS
  # Watchdog got from the NPU. The estimate itself is frame-rate independent
  # (it fits against wall-clock timestamps, not frame counts) -- only the
  # time-to-first-estimate moves.
  min_samples: 5
  # Samples kept per track for the growth-rate fit. Longer smooths noise but
  # spans more real time, and box width grows as ~1/distance, so a
  # straight-line fit over a longer arc carries more model error.
  sample_window: 8
  # Boxes narrower than this fraction of frame width get no TTC: too few
  # pixels for growth to be signal rather than detector jitter.
  min_width_fraction: 0.03
  # Clamps on the reported TTC, both directions.
  ttc_min: 0.2
  ttc_max: 30.0

  # Bearing zones, by normalized box center x.
  # Within this fraction of either edge, discard the person entirely: lens
  # distortion makes position and width (hence TTC) untrustworthy there.
  zone_discard_margin: 0.05
  zone_left_max: 0.33
  zone_right_min: 0.67

  # A closing person is only a hazard at or below this TTC. This gate decides
  # whether anything is reported at all -- the walking-speed assumption lives
  # here, so it is the first number to re-derive for the drone.
  ttc_alert: 3.0
  # Below this TTC a hazard is flagged urgent. Only labels an alert that is
  # already firing (never suppresses one), so it is safe to retune freely.
  ttc_urgent: 1.0
  # Minimum gap before the same track can be reported again.
  track_cooldown: 4.0
  # Longer cooldown for close-but-not-closing hazards: a stationary obstacle
  # stays in frame indefinitely and would otherwise re-fire forever.
  static_cooldown: 8.0
  # Minimum gap between any two reports across all tracks, so a crowd can't
  # produce a continuous stream of them.
  global_gap: 1.2
  # A person with no measurable looming still counts as a hazard once their
  # box bottom reaches this normalized y -- close enough to fill the bottom of
  # frame. Encodes camera height/pitch; see the warning above.
  static_bottom_y: 0.75

state_machine:
  # Grace period before a missing target escalates from "brief dropout, hold
  # and wait" (TEMPORARILY_OCCLUDED) to "actively search" (RECOVERY_SEARCH).
  # Set roughly equal to the tracker's lost_track_buffer duration (30 frames
  # ~= 1s at 30fps): within that window ByteTrack usually re-emits the SAME
  # track id when the person reappears, so holding position beats swinging the
  # camera into a search or grabbing whoever else is on screen.
  occlusion_timeout_seconds: 1.0

identity:
  # Stage 2: encrypted registered-person profile store. See
  # docs/database_design.md. The encryption key is NEVER stored -- it's derived
  # at runtime from the operator passphrase; only the store location and the
  # (non-secret) Argon2id cost parameters live here.
  #
  # store_dir holds these files, ALL gitignored (data/ is ignored):
  #   profiles.db   -- SQLite store; sensitive columns encrypted (AES-256-GCM)
  #   keyvault.json -- legacy single-passphrase vault (scripts/register_person.py)
  #   accounts.json -- multi-user login (Stage 2.5, scripts/app.py): mode, KDF
  #                    params, name-hash salt, wrapped data keys (safe in clear)
  store_dir: "data/identity"
  db_filename: "profiles.db"
  keyvault_filename: "keyvault.json"
  accounts_filename: "accounts.json"
  # Argon2id KDF cost. Tuned so an unlock takes ~0.5s on the RTX 3060 dev
  # machine (measured: time_cost=4 + 512 MiB -> 0.51s) -- deliberately slow to
  # blunt brute force, and memory-hard (512 MiB) to blunt GPU/ASIC attacks.
  # Raising these later is safe: params are stored per-store in keyvault.json,
  # so existing stores keep the values they were created with. memory is in
  # KiB (524288 = 512 MiB).
  argon2_time_cost: 4
  argon2_memory_kib: 524288
  argon2_parallelism: 4
  # Setup refuses a shorter operator passphrase (the KDF slows brute force but
  # can't rescue a trivially guessable passphrase -- see threat model sec 2).
  min_passphrase_length: 12

face:
  # InsightFace model pack (SCRFD detector + ArcFace embedder). buffalo_l is
  # the accurate general pack. Auto-downloads to ~/.insightface on first use.
  # NON-COMMERCIAL model license -- see docs/model_licenses.md.
  model_pack: "buffalo_l"
  # 320 substantially lowers the periodic face pass cost on CPU. Re-entry
  # recognition still runs immediately when a new track appears.
  det_size: 320
  # "cpu" is fine for the one-time registration flow. Switch to "cuda" (needs
  # onnxruntime-gpu) for GPU inference in the live identity loop later.
  device: "cpu"
  # Minimum cosine similarity to call a face a registered person (else UNKNOWN).
  # ArcFace embeddings are unit vectors, so this is in -1..1; same-person pairs
  # typically score well above different-person pairs. 0.35 is a starting point
  # -- tune against your own captured data in Stage 2.5 (measure FAR/FRR).
  match_threshold: 0.35

registration:
  # Bump when the consent terms shown at enrollment change; stored per person.
  consent_version: "v1"
  # Distinct quality-passing samples (ideally different angles) needed to enroll.
  samples_required: 5
  # Reject a captured face below these gates (see registration/quality.py). The
  # blur/brightness thresholds are resolution/camera-dependent starting points
  # -- tune against the live preview if good captures get rejected (or bad ones
  # accepted).
  min_detection_score: 0.6
  min_blur_variance: 40.0   # variance-of-Laplacian on the face crop; higher = sharper
  min_brightness: 50.0      # mean face-crop brightness, 0-255
  max_brightness: 210.0
  min_face_fraction: 0.02   # face box must be >= this fraction of the frame area

identity_tracking:
  # Per-track identity fusion (Stage 2.4). Face recognition is expensive, so it
  # runs every N frames (tracking runs every frame); between runs each track
  # keeps its last identity. New tracks always bypass this cadence, so using a
  # one-second steady-state interval reduces CPU load without delaying re-lock.
  update_every_n_frames: 30
  # Recent identity refreshes remembered per track; the consensus over this
  # window is the track's identity, so one bad frame can't flip it.
  history_window: 5
  # Fraction of the window that must agree on a person to CONFIRM a track as
  # that person. This gate is what makes reacquisition identity-based: a
  # returning track is only re-locked once its face confirms the person, not
  # because it merely appeared where the target was predicted to be.
  min_confidence: 0.6
  # A brand-new track (someone just walked back into frame) keeps forcing a
  # refresh every frame -- not the periodic cadence above -- for up to this
  # many frames while unconfirmed. Covers the first frame's face detection
  # missing (motion blur, walking in at an angle) without waiting out the
  # full cadence, which is what showed as a stale/raw-track-id label lasting
  # several seconds on the Pi. Bounded so a stranger who never confirms
  # doesn't pin the face model to every frame indefinitely.
  reacquire_grace_frames: 10
  # Body-appearance (clothing color) fallback for reacquiring a target who
  # returns facing away, before their face is visible again -- see
  # src/webcam_tracker/reid. Session-only memory: it can only ever vote for
  # someone this session has already face-confirmed, never a stranger.
  appearance_match_threshold: 0.75
  appearance_memory_frames: 90

# Sections for drone_control, etc. are added as each module is implemented,
# not stubbed out empty here ahead of time — an unused config field is a
# bug waiting to hide a typo.
